[package]
name = "musdx"
version = "0.1.0"
description = "mUSDX — USDX Savings, a non-rebasing yield-bearing wrapper for USDX"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "musdx"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
